<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Reservar')}"></head>
<body class="pagina">
    <header th:replace="~{fragmentos :: barraCliente('reservar', ${cliente.nombre})}"></header>

    <main>
        <section class="seccion">
            <div class="contenedor">
                <h1 class="titulo-pagina">Reservar una cancha</h1>
                <p class="nota">Elige un día para ver los turnos disponibles y reserva el que prefieras.</p>
                <div th:replace="~{fragmentos :: mensajes}"></div>

                <div class="panel">
                    <form class="formulario-fila" th:action="@{/cliente/reservar}" method="get">
                        <div class="campo">
                            <label for="fecha">Día</label>
                            <input id="fecha" name="fecha" type="date" th:value="${fecha}" th:min="${hoy}" required>
                        </div>
                        <button class="boton boton-oscuro" type="submit">Buscar turnos</button>
                    </form>
                </div>

                <h2 class="subtitulo" th:text="'Turnos disponibles el ' + ${#temporals.format(fecha, 'dd/MM/yyyy')}">Turnos disponibles</h2>
                <p class="vacio" th:if="${#lists.isEmpty(disponibles)}">No hay turnos disponibles para este día.</p>
                <div class="tabla-envoltura" th:unless="${#lists.isEmpty(disponibles)}">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>Cancha</th>
                                <th>Tipo</th>
                                <th>Hora</th>
                                <th>Capacidad</th>
                                <th>Reservar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${disponibles}">
                                <td th:text="${r.cancha.nombre}"></td>
                                <td th:text="${r.cancha.tipo}"></td>
                                <td th:text="${r.hora}"></td>
                                <td th:text="${r.capacidad}"></td>
                                <td>
                                    <form th:action="@{/cliente/reservar/{id}(id=${r.id})}" method="post">
                                        <input type="hidden" name="fecha" th:value="${fecha}">
                                        <button class="boton boton-principal boton-chico" type="submit">Reservar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
