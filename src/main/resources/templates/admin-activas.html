<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Reservas activas')}"></head>
<body class="pagina">
    <header th:replace="~{fragmentos :: barraAdmin('activas')}"></header>

    <main>
        <section class="seccion">
            <div class="contenedor">
                <h1 class="titulo-pagina">Reservas activas</h1>
                <p class="nota">Consulta las reservas que tienen los clientes. Al cancelar una, el turno queda disponible otra vez.</p>
                <div th:replace="~{fragmentos :: mensajes}"></div>

                <div class="panel">
                    <form class="formulario-fila" th:action="@{/admin/activas}" method="get">
                        <div class="campo">
                            <label for="clienteId">ID de cliente</label>
                            <input id="clienteId" name="clienteId" type="number" th:value="${clienteId}" placeholder="Todos">
                        </div>
                        <button class="boton boton-oscuro" type="submit">Consultar</button>
                    </form>
                </div>

                <p class="vacio" th:if="${#lists.isEmpty(activas)}">No hay reservas activas.</p>
                <div class="tabla-envoltura" th:unless="${#lists.isEmpty(activas)}">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Cancha</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Capacidad</th>
                                <th>Cancelar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${activas}">
                                <td th:text="${r.id}"></td>
                                <td th:text="${r.cliente.id} + ' - ' + ${r.cliente.nombre}"></td>
                                <td th:text="${r.cancha.nombre}"></td>
                                <td th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}"></td>
                                <td th:text="${r.hora}"></td>
                                <td th:text="${r.capacidad}"></td>
                                <td>
                                    <form th:action="@{/admin/reservas/{id}/cancelar(id=${r.id})}" method="post">
                                        <input type="hidden" name="clienteId" th:value="${clienteId}">
                                        <button class="boton boton-peligro boton-chico" type="submit">Cancelar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
